# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
name: BazelTest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bazel_test:
    permissions:
      contents: 'read'
      id-token: 'write'

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    env:
      USE_BAZEL_VERSION: 8.7.0

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1

    - if: >-
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == 'google/ink'
      uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # ratchet:google-github-actions/auth@v2
      with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'
          project_id: '${{ secrets.GCP_PROJECT_ID }}'

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86  # ratchet:bazel-contrib/setup-bazel@v0.19.0
      with:
        bazelisk-cache: true
        disk-cache: true
        repository-cache: true
        external-cache: true

    - name: Test
      run: >
        bazel test
        ${{ (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == 'google/ink') &&
        '--google_default_credentials --remote_cache=https://storage.googleapis.com/ink-open-source-ci/'
        || '' }}
        --test_output=errors --keep_going //ink/...
